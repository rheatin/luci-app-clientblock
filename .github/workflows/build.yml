name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt release to build against'
        required: true
        default: '24.10.4'
      use_apk:
        description: 'Build .apk (OpenWrt 24.10+ apk-based images)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            sdk_arch: x86-64
          - arch: aarch64_cortex-a53
            sdk_arch: aarch64-cortex-a53

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=${{ inputs.openwrt_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "release=24.10.4" >> "$GITHUB_OUTPUT"
          fi
          echo "pkg=$(sed -n 's/^PKG_VERSION:=//p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "rel=$(sed -n 's/^PKG_RELEASE:=//p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # gcc-multilib is unavailable on noble runners; the SDK only needs a
          # working host compiler for the tools build.
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget libelf-dev zstd

      - name: Download SDK
        run: |
          REL="${{ steps.ver.outputs.release }}"
          BASE="https://downloads.openwrt.org/releases/${REL}/targets"
          case "${{ matrix.arch }}" in
            x86_64) TARGET="x86/64"; SDKA="x86-64" ;;
            aarch64_cortex-a53) TARGET="armsr/armv8"; SDKA="aarch64-cortex-a53" ;;
          esac
          # exact name, no HTML scraping: the listing wraps names in quotes
          NAME="openwrt-sdk-${REL}-${SDKA}_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          URL="${BASE}/${TARGET}/${NAME}"
          echo "SDK: $URL"
          if ! curl -fsSL "$URL" -o sdk.tar.zst; then
            # fall back to whatever gcc version this release shipped
            NAME=$(curl -fsSL "${BASE}/${TARGET}/" \
              | grep -oE "openwrt-sdk-${REL}-${SDKA}_gcc-[0-9.]+_musl\.Linux-x86_64\.tar\.zst" | head -1)
            echo "fallback SDK: $NAME"
            URL="${BASE}/${TARGET}/${NAME}"
            curl -fsSL "$URL" -o sdk.tar.zst
          fi
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1 2>/dev/null || \
            (zstd -d sdk.tar.zst -o sdk.tar && tar -xf sdk.tar -C sdk --strip-components=1)
          ls sdk | head

      - name: Prepare package feed
        run: |
          mkdir -p sdk/package/clientblock
          cp -r Makefile root htdocs postinst prerm postrm sdk/package/clientblock/
          [ -f LICENSE ] && cp LICENSE sdk/package/clientblock/ || true

      - name: Configure (apk output)
        run: |
          cd sdk
          # apk packaging is selected by CONFIG_USE_APK in 24.10+
          printf 'CONFIG_USE_APK=y\n' >> .config
          make defconfig
          grep -E '^CONFIG_USE_APK' .config || echo "WARN: USE_APK not available in this SDK"

      - name: Build package
        run: |
          cd sdk
          make package/clientblock/compile V=s -j$(nproc) 2>&1 | tail -60

      - name: Collect artifacts
        run: |
          mkdir -p out
          find sdk/bin -type f \( -name '*.apk' -o -name '*.ipk' \) \
            -exec cp {} out/ \;
          ls -lh out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-clientblock-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## luci-app-clientblock ${{ github.ref_name }}

            Client access control for OpenWrt: device and external-IP blocking,
            realtime login-attack protection, offline IP region lookup.

            ### Install

            Download the `.apk` matching your architecture and run:

            ```sh
            apk add --allow-untrusted luci-app-clientblock_*.apk
            ```

            Or use the shell installer (works on any OpenWrt):

            ```sh
            tar -xzf luci-app-clientblock-*.tar.gz
            cd luci-app-clientblock && sh install.sh
            ```
